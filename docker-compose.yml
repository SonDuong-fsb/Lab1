services:
  api:
    build: .
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - MODEL_PATH=/app/models/credit_model.joblib
      - MODEL_VERSION=1.0.0
      - REVIEW_THRESHOLD=0.30
      - DECLINE_THRESHOLD=0.60
    restart: unless-stopped
